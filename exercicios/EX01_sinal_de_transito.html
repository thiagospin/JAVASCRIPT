<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    select, input {
        width: 200px;
        height: 40px;
        border-radius: 10px;
    }

    label {
        display: inline-block;
        width: 200px;

    }

</style>
<body>
    <div>
        <label for="sinal">COR DO SINAL</label>
        <select name="sinal" id="sinal">
            <option value="verde">VERDE</option>
            <option value="amarelo">AMARELO</option>
            <option value="vermelho">VERMELHO</option>
        </select>
    </div>
    <div>
        <button onclick="verificarSinal()">
            Verificar Sinal    
        </button>
    </div>
    <div>
        <label>RESULTADO</label>
        <input type="text" id="resultado" readonly>
    </div>
    
    <script>


        function verificarSinal() {
            
            var corSelecionada = document.getElementById("sinal").value
            
            if (corSelecionada == 'verde') {
                document.getElementById("resultado").value = "SIGA"
            }

            if (corSelecionada == 'amarelo') {
                document.getElementById("resultado").value = "ATENÇÃO"
            }

            if (corSelecionada == 'vermelho') {
                document.getElementById("resultado").value = "PARE"
            }


        }

        





        

    </script>
</body>
</html>
