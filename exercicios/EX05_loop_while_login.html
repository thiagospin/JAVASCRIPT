<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div style="height: 50vh; width: 25vw; background-color:darkcyan; border-radius: 10px;">
      <div style="text-align: center; padding-top: 50px;">
        <div>
          <label style="font-weight: bolder; font-family: Tahoma">e-mail</label>
        </div>
        <div>
          <input type="email" style="width: 20vw; height: 5vh; border-radius: 5px; font-size: large;" />
        </div>
      </div>
      <div style="text-align: center; padding-top: 50px">
        <div>
          <label style="font-weight: bolder; font-family: Tahoma">senha</label>
        </div>
        <div>
          <input id="senha" type="password" style="width: 20vw; height: 5vh; border-radius: 5px; font-size: large;" />
        </div>
      </div>
      <div style="text-align: center; padding: 50px">
        <button id="bt" style="width: 10vw; height: 5vh; border-radius: 5px;"
        onclick="logar()">LOGIN</button>
      </div>
    </div>

    <script>
      const senhaCorreta = "1234";
      let tentativas = 0;

      function logar() {
        const senhaDigitada = document.getElementById("senha").value;

        while (tentativas < 3 && senhaDigitada !== senhaCorreta) {
          
          tentativas = tentativas + 1;

          if (tentativas >= 3) {
            alert("Senha incorreta 3 vezes. Login bloqueado.");
            document.getElementById("bt").disabled = true;
            return;
          }

          alert("Senha incorreta. Tentativa " + tentativas + " de 3.");
          return;
        }

        alert("Login realizado com sucesso!");
        tentativas = 0;
      }
    </script>

  </body>
</html>
