<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Aluno - Requisições POST HTTP com Axios</title>
    <link rel="stylesheet" href="css/axios_style.css" />

    <!-- Referenciando a CDN do AXIOS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- CDN Bootrsap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <!-- conteiner que vai abraçar todo o formulário -->
    <div class="container text-center bg-info p-5">
      <!-- campos input e label -->
      <div class="m-2 bg-info">
        <label class="form-label">nome</label>
        <input type="text" class="form-control" id="nome" />
      </div>

      <div class="m-2 bg-info">
        <label class="form-label">e-mail</label>
        <input type="email" class="form-control" id="email" />
      </div>

      <div class="m-2 bg-info">
        <select class="form-select" id="turno">
          <option selected>selecione o turno</option>
          <option value="1">Manhã</option>
          <option value="2">Tarde</option>
          <option value="3">Noite</option>
        </select>
      </div>

      <div class="m-2 bg-info">
        <label class="form-label">turma</label>
        <input type="number" class="form-control" id="turma" />
      </div>

      <div class="m-2 bg-info">
        <label class="form-label">Observações</label>
        <textarea class="form-control" rows="3" id="obs"></textarea>
      </div>

      <button class="btn btn-success" onclick="cadastrar()">CADASTRAR</button>
    </div>

    <script>
      // MODELO DE DADOS
      //
      // var dados = {
      //     "name": nome,
      //     "data": {
      //         "turno": turno,
      //         "email": email,
      //         "turma": turma,
      //         "observacoes": obs
      //     }
      // }

      function cadastrar() {

        const url_cadastro = "https://api.restful-api.dev/objects";


        nome = document.getElementById("nome").value;
        turma = document.getElementById("turma").value;
        turno = document.getElementById("turno").value;
        email = document.getElementById("email").value
        observacoes = document.getElementById("obs").innerHTML;

        var dados = {
          "name": nome,
          "data": {
            "turno": turno,
            "email": email,
            "turma": turma,
            "observacoes": observacoes,
          },
        };

        axios.post(url_cadastro, dados)
            .then(resposta => {
                
                // usando o AXIOS para fazer um POST
                // A resposta inclui um atributo "status" e "statusText" 
                // e um atributo "data", que são os dados retornados pelo servidor

                console.log(`Status da Chamada: ${resposta.status} - ${resposta.statusText}`)
                console.log(`ID do aluno cadastrado: ${resposta.data.id}`)

            })


      }


      // realizando um GET com o id do objeto cadastrado previamente
      function requestGet() {
        var id_produto = document.getElementById("id-produto").value;
        var url_consulta = `https://api.restful-api.dev/objects/${id_produto}`;
        console.log(url_consulta);

        axios.get(url_consulta).then((resposta) => {
          console.log(resposta.data);
        });
      }
    </script>
  </body>
</html>
